<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Simulador de Compras - BBVA LINA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 1.5rem;
            border-radius: 8px;
        }
        .logo_header {
            width: 150px;
        }
        .btn-volver {
            background-color: #0a7adc;
            color: #ffffff;
            text-decoration: none;
            padding: 0.6rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }
        .btn-volver:hover {
            background-color: #004481;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem 1.5rem 3rem 1.5rem;
        }
        .form-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 680px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .section-header {
            background: #e2e8f0;
            color: #475569;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            padding: 10px;
            text-transform: uppercase;
        }
        .card-box {
            background: #ffffff;
            padding: 1.2rem 1.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-info span {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 700;
        }
        .card-info h2 {
            font-size: 1.6rem;
            color: #15803d;
            margin: 4px 0;
            font-weight: 800;
        }
        .card-info p {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }
        .form-body {
            padding: 1.8rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .input-text {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .input-text:focus {
            border-color: #0a7adc;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 1rem;
            margin: 1.5rem 1.5rem 0 1.5rem;
            border-radius: 6px;
            border: 1px solid #f5c6cb;
            font-size: 0.9rem;
            text-align: center;
        }
        .btn-submit {
            width: 100%;
            background: #004481;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-submit:hover {
            background: #0a7adc;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #ffffff;
            font-size: 0.85rem;
            border-top: 1px solid #e1e8ed;
            background: #004481;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <img class="logo_header" src="{{ url_for('static', filename='img/BBVALINAGOLD.png') }}" alt="Logo BBVA LINA">
            <div>
                <a href="{{url_for('menu_roles')}}" class="btn-volver">Volver a BBVA LINA</a>
                <a href="{{url_for('dashboard_cliente')}}" class="btn-volver">Volver</a>
            </div>
    </header>

    <main>
        <div class="form-card">
            {% if error %}
                <div class="alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="section-header">TARJETA DE CRÉDITO - LÍNEA DISPONIBLE</div>
                <div class="card-box">
                    <div class="card-info">
                        <span>VISA CRÉDITO BBVA TOMIN</span>
                        <h2>${{ "%.2f"|format(saldo_favor) }} <small style="font-size: 0.75rem; color:#64748b;">DISPONIBLE</small></h2>
                        <p>{{ tarjeta_tdc }}</p>
                    </div>
                </div>

                <div class="section-header">SIMULADOR DE COMPRAS (TERMINAL POS)</div>
                <div class="form-body">
                    <div class="form-group">
                        <label for="establecimiento">Comercio / Establecimiento</label>
                        <input type="text" id="establecimiento" name="establecimiento" class="input-text" placeholder="Ej. Amazon, Walmart, Starbucks" value="Comercio Demo POS">
                    </div>

                    <div class="form-group">
                        <label for="monto_compra">Monto de la Compra ($ MXN)</label>
                        <input type="number" step="0.01" min="0.01" id="monto_compra" name="monto_compra" class="input-text" placeholder="0.00" required>
                    </div>

                    <button type="submit" class="btn-submit">Procesar Compra</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        BBVA LINA System &copy; 2026 - Módulo Administrativo Integral
    </footer>
</body>
</html>
