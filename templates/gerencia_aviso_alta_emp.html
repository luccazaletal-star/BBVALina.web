<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Empleado Registrado - BBVA LINA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .logo_header {
            width: 150px;
        }
        .btn-volver {
            background-color: #004481;
            color: #ffffff;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }
        .btn-volver:hover {
            background-color: #0a7adc;
        }
        main {
            max-width: 550px;
            margin: 4rem auto;
            padding: 0 1rem;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-aviso {
            background: #ffffff;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            border-top: 6px solid #28a745;
        }
        .icon-check {
            width: 70px;
            height: 70px;
            background-color: #e8f5e9;
            color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 auto 1.5rem auto;
        }
        h1 {
            color: #004481;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
        }
        p {
            color: #555;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .acciones-container {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .btn-primary {
            background-color: #004481;
            color: #ffffff;
            text-decoration: none;
            padding: 0.85rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0a7adc;
        }
        .btn-secondary {
            background-color: #f4f7f6;
            color: #004481;
            text-decoration: none;
            padding: 0.85rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            border: 1px solid #004481;
            transition: background 0.3s ease;
        }
        .btn-secondary:hover {
            background-color: #e2e8f0;
        }
        footer {
            background-color: #004481;
            color: #ffffff;
            font-size: 0.85rem;
            padding: 1.5rem;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <img class="logo_header" src="{{ url_for('static', filename='img/BBVALINAGOLD.png') }}" alt="Logo BBVA LINA">
        <a href="{{ url_for('portal_ger_empleado') }}" class="btn-volver">Volver al Menú</a>
    </header>

    <main>
        <div class="card-aviso">
            <div class="icon-check">✓</div>
            <h1>¡Empleado Registrado!</h1>
            <p>El registro del empleado se ha completado con éxito en el sistema.</p>
            
            <div class="acciones-container">
                <a href="{{ url_for('gerencia_alta_emp') }}" class="btn-primary">Registrar otro Empleado</a>
                <a href="{{ url_for('portal_ger_empleado') }}" class="btn-secondary">Volver al Menú de Empleados</a>
            </div>
        </div>
    </main>

    <footer>
        BBVA LINA System &copy; 2026 - Módulo Administrativo Integrado
    </footer>
</body>
</html>
