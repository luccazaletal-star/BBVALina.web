<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Portal Multirrol - BBVA LINA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Benton Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }
        body{
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header{
            background-color: #ffffff;
            color: white;
            padding: 0rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 1.5rem;
        }
        .logo_header{
            text-align: left;
            width: 150px;
            margin: 0%;
        }
        .btn-volver{
            background-color: #0a7adc;
            color: #f4f7f6;
            text-decoration: none;
            padding: 0.6rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 1s ease;
        }
        .btn-volver:hover{
            background-color: #004481;
        }
        .banner-anuncio{
            background-color: #ffffff;
            color: #004481;
            font-family: 'Plus Jakarta Sans', 'Benton Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            display: flex;
            align-items: center;
            background-color: #ffffff;
            color: #004481;
            padding: 2rem 2rem;
            margin-top: 30px;
            margin-bottom: 60px;
            margin-left: 0.5cm;
            margin-right: 0.5cm;
            gap: 2rem;
        }
        .banner_img1 img{width: 100%;
            max-width: 600px;
            height: 350px;
            object-fit: cover;
        }
        .input-style{
            background-color: #ffffff;
            color: #004481;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .input{
            font-size: 1.2rem;
            background-color: #ffffff;
            border: 0px solid #ffffff;
            margin-left: 10px;
        }
        .banner-datos{
            background-color: #ffffff;
            color: #004481;
            font-family: 'Plus Jakarta Sans', 'Benton Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            display: block;
            background-color: #ffffff;
            color: #004481;
            padding: 2rem 2rem;
            margin-top: 30px;
            margin-bottom: 60px;
            margin-left: 0.5cm;
            margin-right: 0.5cm;
            gap: 2rem;
        }
        .input2{
            font-size: 1.2rem;
            background-color: #ffffff;
            border: 0px solid #ffffff;
            margin-left: 10px;
            width: 30%;
        }
        .btn-bbva{
            background-color: #004481;
            color: #f4f7f6;
            display: inline-block;
            margin-top: 10px;
            font-size: 2rem;
            border: 0px solid #ffffff;
            padding: 5px;
            transition: background 0.5s ease;
        }
        .btn-bbva:hover{
            background-color: #0a7adc;
        }
        .alert-error{
            background-color: #004481;
            color: #f4f7f6;
            font-family: 'Plus Jakarta Sans', 'Benton Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            display: block;
            padding: 2rem 2rem;
            margin-top: 30px;
            margin-bottom: 60px;
            margin-left: 0.5cm;
            margin-right: 0.5cm;
            gap: 2rem;           
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #ffffff;
            font-size: 0.85rem;
            border-top: 1px solid #e1e8ed;
            background: #004481;
        }
    </style>
    </head>
    <body>
        <header>
            <img class="logo_header" src="{{url_for('static',filename='img/BBVALINAGOLD.png')}}" alt="Logo BBVA LINA">
            <a href="{{url_for('menu_roles')}}" class="btn-volver">Volver a BBVA LINA</a>
        </header>
        <main>
            {% if error %}
                <div class="alert-error">
                    {{ error }}
                </div>
            {% endif %}
            <section class="banner-anuncio">
            <div >
                <h1>BBVA LINA ofrece entregas a la puerta de tu casa</h1>
                <p>Indica tu direccion para programar una entrega</p>
            </div>
            <div class="banner_img1">
                <img src="{{url_for('static', filename='img/bbvapagoterminal.jpg')}}" alt="Tap to pay">
            </div>
            </section>
            <section class="banner-datos">
                <form action="{{ url_for('crear_cuenta_direccion') }}" method="POST">
                <div class="input-style">
                    <label for="calle_usr">Ingrese la calle </label>
                    <input
                    class="input"
                    type="text" 
                    id="calle_usr" 
                    name="calle_usr" 
                    placeholder="Calle" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="numcalle_usr">Ingrese el numero exterior </label>
                    <input
                    class="input"
                    type="text" 
                    id="numcalle_usr" 
                    name="numcalle_usr" 
                    placeholder="Numero exterior" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="col_usr">Ingrese la colonia </label>
                    <input
                    class="input"
                    type="text" 
                    id="col_usr" 
                    name="col_usr" 
                    placeholder="Colonia" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="ciudad_usr">Ingrese la ciudad o delegacion </label>
                    <input
                    class="input"
                    type="text" 
                    id="ciudad_usr" 
                    name="ciudad_usr" 
                    placeholder="Ciudad/Delegacion" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="estado_usr">Ingrese el estado </label>
                    <input
                    class="input"
                    type="text" 
                    id="estado_usr" 
                    name="estado_usr" 
                    placeholder="estado" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="cp_usr">Ingrese el Codigo Postal </label>
                    <input
                    class="input"
                    type="text" 
                    id="cp_usr" 
                    name="cp_usr" 
                    placeholder="C.P" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="detallesdirec_usr">Ingrese detalles adicionales de entrega </label>
                    <input
                    class="input2"
                    type="text" 
                    id="detallesdirec_usr" 
                    name="detallesdirec_usr" 
                    placeholder="Detalles" 
                    required
                    >
                </div>
                <button type="submit" class="btn-bbva">Enviar</button>
                </form>
            </section>
        </main>
    <footer>
        <div>
            BBVA LINA System &copy; 2026 - Módulo Administrativo Integral
        </div>
    </footer>
    </body>
    </html>
