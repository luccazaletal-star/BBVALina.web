<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Portal Multirrol - BBVA LINA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Benton Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }
        body{
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header{
            background-color: #ffffff;
            color: white;
            padding: 0rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 1.5rem;
        }
        .logo_header{
            text-align: left;
            width: 150px;
            margin: 0%;
        }
        .btn-volver{
            background-color: #0a7adc;
            color: #f4f7f6;
            text-decoration: none;
            padding: 0.6rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 1s ease;
        }
        .btn-volver:hover{
            background-color: #004481;
        }
        .banner-anuncio{
            background-color: #ffffff;
            color: #004481;
            font-family: 'Plus Jakarta Sans', 'Benton Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            display: flex;
            align-items: center;
            background-color: #ffffff;
            color: #004481;
            padding: 2rem 2rem;
            margin-top: 30px;
            margin-bottom: 60px;
            margin-left: 0.5cm;
            margin-right: 0.5cm;
            gap: 2rem;
        }
        .banner_img1 img{width: 100%;
            max-width: 600px;
            height: 350px;
            object-fit: cover;
        }
        .input-style{
            background-color: #ffffff;
            color: #004481;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .input{
            font-size: 1.2rem;
            background-color: #ffffff;
            border: 0px solid #ffffff;
            margin-left: 10px;
        }
        .banner-datos{
            background-color: #ffffff;
            color: #004481;
            font-family: 'Plus Jakarta Sans', 'Benton Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            display: block;
            background-color: #ffffff;
            color: #004481;
            padding: 2rem 2rem;
            margin-top: 30px;
            margin-bottom: 60px;
            margin-left: 0.5cm;
            margin-right: 0.5cm;
            gap: 2rem;
        }
        .input2{
            font-size: 1.2rem;
            background-color: #ffffff;
            border: 0px solid #ffffff;
            margin-left: 10px;
            width: 30%;
        }
        .btn-bbva{
            background-color: #004481;
            color: #f4f7f6;
            display: inline-block;
            margin-top: 10px;
            font-size: 2rem;
            border: 0px solid #ffffff;
            padding: 5px;
            transition: background 0.5s ease;
        }
        .btn-bbva:hover{
            background-color: #0a7adc;
        }
        .alert-error{
            background-color: #004481;
            color: #f4f7f6;
            font-family: 'Plus Jakarta Sans', 'Benton Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            display: block;
            padding: 2rem 2rem;
            margin-top: 30px;
            margin-bottom: 60px;
            margin-left: 0.5cm;
            margin-right: 0.5cm;
            gap: 2rem;           
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #ffffff;
            font-size: 0.85rem;
            border-top: 1px solid #e1e8ed;
            background: #004481;
        }

        @media (max-width: 700px) {
            header{
                padding: 0.8rem 1rem;
                margin: 1rem;
                flex-wrap: wrap;
                gap: 0.8rem;
            }
            .banner-anuncio{
                flex-direction: column;
                margin-left: 0;
                margin-right: 0;
                padding: 1.5rem;
            }
            .banner_img1 img{
                height: 220px;
            }
            .banner-datos{
                margin-left: 0;
                margin-right: 0;
                padding: 1.5rem;
            }
            .input2{
                width: 100%;
            }
        }
    </style>
    </head>
    <body>
        <header>
            <img class="logo_header" src="{{url_for('static',filename='img/BBVALINAGOLD.png')}}" alt="Logo BBVA LINA">
            <a href="{{url_for('menu_roles')}}" class="btn-volver">Volver a BBVA LINA</a>
        </header>
        <main>
            {% if error %}
                <div class="alert-error">
                    {{ error }}
                </div>
            {% endif %}
            <section class="banner-anuncio">
            <div >
                <h1>BBVA LINA te acompaña siempre donde sea que estes</h1>
                <p>Ahora BBVA llega contigo a todos lados cuando mas lo necesitas</p>
            </div>
            <div class="banner_img1">
                <img src="{{url_for('static', filename='img/bbvamercado.jpg')}}" alt="Señora recibiendo su tarjeta en casa">
            </div>
            </section>
            <section class="banner-datos">
                <form action="{{ url_for('crear_cuenta') }}" method="POST">
                <div class="input-style">
                    <label for="nombre_usr">Ingrese su nombre/s </label>
                    <input
                    class="input"
                    type="text" 
                    id="nombre_usr" 
                    name="nombre_usr" 
                    placeholder="Nombre/s" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="apellpat_usr">Ingrese su primer apellido </label>
                    <input
                    class="input"
                    type="text" 
                    id="apellpat_usr" 
                    name="apellpat_usr" 
                    placeholder="Apellido" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="apellmat_usr">Ingrese su segundo apellido </label>
                    <input
                    class="input"
                    type="text" 
                    id="apellmat_usr" 
                    name="apellmat_usr" 
                    placeholder="Apellido" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="edad_usr">Ingrese su edad </label>
                    <input
                    class="input"
                    type="number" 
                    id="edad_usr" 
                    name="edad_usr" 
                    placeholder="Edad" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="curp_usr">Ingrese su CURP como aparece en la INE </label>
                    <input
                    class="input2"
                    type="text" 
                    id="curp_usr" 
                    name="curp_usr" 
                    placeholder="AAAA000000AAAAAAA0" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="ine_usr">Ingrese los 10 digitos detras de su INE IDMEX: </label>
                    <input
                    class="input2"
                    type="text" 
                    id="ine_usr" 
                    name="ine_usr" 
                    placeholder="0000000000" 
                    required
                    >
                </div>
                <div class="input-style">
                    <label for="contr_usr">Ingrese una contraseña de 8 digitos </label>
                    <input
                    class="input"
                    type="text" 
                    id="contr_usr" 
                    name="contr_usr" 
                    placeholder="00000000" 
                    required
                    >
                </div>
                <button type="submit" class="btn-bbva">Enviar</button>
                </form>
            </section>
        </main>
    <footer>
        <div>
            BBVA LINA System &copy; 2026 - Módulo Administrativo Integral
        </div>
    </footer>
    </body>
    </html>
